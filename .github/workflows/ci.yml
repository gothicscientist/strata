name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python engine, API, agent
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strata" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install -p .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check strata tests ../../data/pipeline
      - name: Test (SQLite + Postgres)
        env:
          STRATA_TEST_POSTGRES_URL: postgresql+psycopg://strata:strata@localhost:5432/strata_test
        run: .venv/bin/pytest -q -m "not r and not live"

  admixtools:
    name: qpAdm (R + ADMIXTOOLS 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache R environment
        uses: actions/cache@v4
        with:
          path: ~/strata-r
          key: strata-r-${{ hashFiles('services/worker/r/install_env.sh') }}
      - name: Install R + ADMIXTOOLS 2
        run: |
          if [ ! -x "$HOME/strata-r/bin/Rscript" ]; then
            bash services/worker/r/install_env.sh "$HOME/strata-r"
          fi
      - name: Install Python package
        working-directory: services/api
        run: |
          uv venv --python 3.12 .venv
          uv pip install -p .venv/bin/python -e ".[dev]"
      - name: Test formal f-statistics
        working-directory: services/api
        run: STRATA_RSCRIPT="$HOME/strata-r/bin/Rscript" .venv/bin/pytest -q -m r

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
