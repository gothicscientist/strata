name: Build deployment runtime
on:
  workflow_dispatch:
  push:
    branches: [codex/deploy-stratalab-cc]
    paths: [services/**, data/**, docs/methods/**, .dockerignore, .github/workflows/runtime-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/gothicscientist/strata-runtime:${{ github.sha }}
            ghcr.io/gothicscientist/strata-runtime:portfolio
          labels: |
            org.opencontainers.image.source=https://github.com/gothicscientist/strata
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
