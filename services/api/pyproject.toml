[project]
name = "strata"
version = "0.1.0"
description = "Strata: computational population genetics engine, API and research agent"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "anthropic>=0.40",
  "openai>=1.50",
  "rank-bm25>=0.2.2",
  "jinja2>=3.1",
  "sse-starlette>=2.1",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "msprime>=1.3", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["r: requires R + ADMIXTOOLS 2", "slow: slow tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Numerical code uses conventional matrix names (G, X, A, S, W).
"strata/analysis/*" = ["N803", "N806"]
"strata/io/*" = ["N803", "N806"]
"tests/analysis/*" = ["N803", "N806"]
"tests/io/*" = ["N803", "N806"]
